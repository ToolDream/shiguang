  <rect x="52.5" y="38.5" width="759" height="461" rx="12.5" fill="none" stroke="#c8d5e3"/>
  <text x="432" y="525" text-anchor="middle" class="muted" font-size="11">拾光截图 · 设置窗口设计稿（非运行截图）</text>
