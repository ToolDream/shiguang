<svg xmlns="http://www.w3.org/2000/svg" width="864" height="544" viewBox="0 0 864 544" role="img" aria-labelledby="title">
  <title id="title">拾光截图 · 设置窗口设计稿（常规）</title>
  <defs>
    <linearGradient id="desk" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#edf4fb"/><stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#398ed0"/><stop offset="1" stop-color="#2265ac"/>
    </linearGradient>
    <filter id="shadow" x="-.12" y="-.14" width="1.24" height="1.35">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="window"><rect x="52" y="38" width="760" height="462" rx="13"/></clipPath>
    <style>
      text { font-family: 'Noto Sans CJK SC', sans-serif; fill: #203045; }
      .muted { fill: #52647a; }
      .medium { font-weight: 500; }
      .strong { font-weight: 700; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="864" height="544" fill="url(#desk)"/>
  <rect x="54" y="47" width="756" height="454" rx="15" fill="#244669" opacity=".17" filter="url(#shadow)"/>
  <g clip-path="url(#window)">
    <rect x="52" y="38" width="760" height="462" fill="#fff"/>
    <rect x="52" y="91" width="182" height="410" fill="#f6f8fc"/>
    <path d="M234 91v410M52 91h760" stroke="#e2e9f1" fill="none"/>

    <!-- Title bar -->
    <svg x="71" y="53" width="22" height="22" viewBox="0 0 128 128">
      <rect width="128" height="128" rx="29.333" fill="url(#blue)"/>
      <path d="M60 22 C65 48 73 56 99 61 C73 66 65 74 60 100 C55 74 47 66 21 61 C47 56 55 48 60 22Z" fill="white"/>
      <circle cx="100" cy="26" r="8" fill="white"/>
    </svg>
    <text x="104" y="70" class="medium" font-size="14">拾光截图</text>
    <circle cx="169" cy="64.5" r="1.4" fill="#8192a5"/>
    <text x="180" y="70" class="muted" font-size="13">设置</text>
    <path d="M722 64.5h11m37-5 10 10m0-10-10 10" class="line" stroke="#485d75" stroke-width="1.55"/>

    <!-- Sidebar -->
    <rect x="65" y="110" width="156" height="40" rx="8" fill="#e6f0fb"/>
    <rect x="65" y="119" width="3" height="22" rx="1.5" fill="#2b73b7"/>
    <g class="line" stroke="#1f609b" stroke-width="1.55">
      <path d="M79 127h3m5 0h8m-16 6h8m5 0h3"/>
      <circle cx="84.5" cy="127" r="2.3"/><circle cx="89.5" cy="133" r="2.3"/>
    </g>
    <text x="106" y="135" class="medium" font-size="14" style="fill:#1c588f">常规</text>
    <g class="line" stroke="#5b6d83" stroke-width="1.55">
      <path d="M80 173a7 7 0 0 1 12-3l2 2m0-5v5h-5m5 5a7 7 0 0 1-12 3l-2-2m0 5v-5h5"/>
    </g>
    <text x="106" y="180" class="medium muted" font-size="14">软件更新</text>
    <path d="M68 418h151" stroke="#e1e8f0"/>
    <circle cx="77" cy="439" r="3.5" fill="#2b8367"/>
    <text x="88" y="443.5" class="muted" font-size="12">托盘运行中</text>
    <rect x="68.5" y="454.5" width="150" height="31" rx="7" fill="#fff" stroke="#dce5ef"/>
    <text x="143.5" y="474.8" text-anchor="middle" class="medium" font-size="12.5">退出拾光</text>

    <!-- General settings -->
    <text x="258" y="137" class="strong" font-size="24">常规</text>
    <text x="258" y="160" class="muted" font-size="13">管理截图快捷键与 Windows 登录启动设置。</text>

    <rect x="258.5" y="180.5" width="529" height="194" rx="10" fill="#fff" stroke="#dfe7f0"/>
    <text x="275" y="207" class="medium" font-size="14.5">区域截图快捷键</text>
    <text x="275" y="227" class="muted" font-size="12.5">按下当前组合键，即可开始框选。</text>

    <g fill="#f5f8fc" stroke="#dce5ee">
      <rect x="275.5" y="240.5" width="44" height="31" rx="6"/>
      <rect x="342.5" y="240.5" width="48" height="31" rx="6"/>
      <rect x="413.5" y="240.5" width="31" height="31" rx="6"/>
    </g>
    <g font-size="12" class="medium" text-anchor="middle">
      <text x="297.5" y="260.5">Ctrl</text><text x="366.5" y="260.5">Shift</text><text x="429" y="260.5">S</text>
      <text x="331" y="260.5" class="muted">+</text><text x="402" y="260.5" class="muted">+</text>
    </g>
    <rect x="691.5" y="240.5" width="79" height="31" rx="6" fill="#fff" stroke="#ccd9e7"/>
    <text x="731" y="260.8" text-anchor="middle" class="medium" font-size="12.5">更改</text>

    <path d="M275 289.5h496" stroke="#e8edf3"/>
    <text x="275" y="321" class="medium" font-size="14.5">登录 Windows 时启动拾光</text>
    <text x="275" y="342" class="muted" font-size="12.5">开机自动驻留托盘，不弹出设置窗口。</text>
    <rect x="732" y="316" width="39" height="22" rx="11" fill="#dce4ee"/>
    <circle cx="743" cy="327" r="8" fill="#fff" stroke="#cbd7e5"/>

    <circle cx="264.5" cy="472" r="6.1" class="line" stroke="#71879f" stroke-width="1.2"/>
    <path d="M264.5 471.5v3.3" class="line" stroke="#71879f" stroke-width="1.25"/>
    <circle cx="264.5" cy="469.7" r=".75" fill="#71879f"/>
    <text x="277" y="476.5" class="muted" font-size="12">关闭设置窗口后，拾光仍在托盘待命。</text>
